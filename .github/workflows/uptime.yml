# NRG uptime check: every 10 minutes GitHub checks the server and the project links.
# If something is down the run fails, and GitHub emails the repo owner.
name: Uptime check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check server and links
        run: |
          fail=0
          check() { # name url expected-status
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$2" || echo 000)
            if [ "$code" = "$3" ]; then echo "OK    $1 ($code)"; else echo "DOWN  $1: got $code, expected $3  $2"; fail=1; fi
          }
          check "n8n server (api)"      https://api.nrg-egypt.com/healthz            200
          check "Wasl app"              https://wasl.nrg-egypt.com/                  200
          check "Basata closing link"   https://c3.nrg-egypt.com/closing             302
          check "Basata closing page"   https://api.nrg-egypt.com/webhook/basata-sheet 200
          check "Owners association"    https://api.nrg-egypt.com/webhook/omara      200
          check "Shaghlana"             https://api.nrg-egypt.com/webhook/shaghlana  200
          check "Padel link"            https://padel.nrg-egypt.com/                 302
          exit $fail
