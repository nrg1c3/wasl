# Wasl uptime check: every 10 minutes GitHub checks the Wasl app and its server.
# (Other NRG projects are watched by the server's own alerts, not from this public repo.)
# If something is down the run fails, and GitHub emails the repo owner.
name: Uptime check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Wasl and its server
        run: |
          fail=0
          check() { # name url expected-status
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$2" || echo 000)
            if [ "$code" = "$3" ]; then echo "OK    $1 ($code)"; else echo "DOWN  $1: got $code, expected $3  $2"; fail=1; fi
          }
          check "n8n server (api)"      https://api.nrg-egypt.com/healthz            200
          check "Badalak app"           https://badalak.nrg-egypt.com/                  200
          exit $fail
